<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -70 670 740" width="630" height="673" style="overflow: visible;">
    <style>
        .s0 { fill: #ffffff; stroke: #000000; stroke-miterlimit: 100; stroke-width: 10 } 
        .s1 { fill: none; stroke: #16233f; stroke-linecap: round; stroke-width: 28 } 
        .s2 { fill: #2f5fa8; stroke: #16233f; stroke-miterlimit: 100; stroke-width: 3 } 
        .s3 { fill: #c1272d } 
        .s4 { fill: #ead9b4 } 
        .s5 { fill: #2b2b2b } 
        
        /* 1. Global Scale for Checkmark + Pencil */
        #scaled-mark {
            transform: scale(1.15);
            transform-origin: 350px 300px;
        }

        /* 2. Anisotropic Scale ALONG THE PENCIL'S ANGLE (-57.2 deg) */
        #thick-pencil {
            /* Pivot point near the middle of the pencil shaft */
            transform-origin: 400px 250px;
            
            /* Rotate to 0deg -> Scale thickness (Y-axis) by 1.35x -> Rotate back */
            transform: rotate(-57.2deg) scale(1, 1.25) rotate(57.2deg);
        }
    </style>
